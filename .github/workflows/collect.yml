name: Collect featured proxies

on:
  schedule:
    # Matches schedule.collectionCron in config/collector.json (every 2 hours).
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proxy-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Restore HTTP cache
        uses: actions/cache@v4
        with:
          path: .cache/collector
          key: collector-cache-${{ github.run_id }}
          restore-keys: |
            collector-cache-

      - name: Collect, verify, and rank approved endpoints
        run: npm run collect:proxies

      - name: Sync public data
        run: npm run data:sync

      - name: Build site
        run: npm run build
        env:
          VITE_SITE_URL: https://telegram-proxy-hub.pages.dev
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}

      - name: Commit refreshed data only when it changed
        run: |
          if [ -z "$(git status --porcelain -- data/top-proxies.json data/collector-state.json public/data/top-proxies.json)" ]; then
            echo "No featured proxy data changes."
            exit 0
          fi
          git config user.name "proxy-hub-bot"
          git config user.email "proxy-hub-bot@users.noreply.github.com"
          git add data/top-proxies.json data/collector-state.json public/data/top-proxies.json
          git commit -m "chore(data): refresh verified featured proxies"
          git push
